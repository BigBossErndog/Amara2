<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
      body {
        background-color: #1d3a51;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      .emscripten {
        text-align: center;
        color: white;
      }

      .preload-elements {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      
      #loading-container {
        width: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #made-with {
        color: white;
        font-size: 1.2em;
        margin-bottom: 10px;
      }

      #progress {
        width: 100vw;
        height: 20px;
        appearance: none;
        -webkit-appearance: none;
        background-color: gray;
        border: none;
        border-radius: 0;
      }

      #progress::-webkit-progress-bar {
        background-color: gray;
      }

      #progress::-webkit-progress-value {
        background-color: #b1d7e9;
      }

      #progress::-moz-progress-bar {
        background-color: #b1d7e9;
      }

      canvas.emscripten {
        border: 0;
        background-color: #1d3a51;
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      canvas.emscripten:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-container" class="emscripten">
      <div id="preload-elements">
        <div id="made-with"><a href="https://ernest-placido.itch.io/amara2" style="color: white; text-decoration: none;">Made with Amara2</a></div>
        <br>
        <progress value="0" max="100" id="progress"></progress>
        <br><br>
      </div>
      <div id="status">Downloading...</div>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var canvasElement = document.getElementById('canvas');
      var madeWithElement = document.getElementById('made-with');
      var preloadElement = document.getElementById('preload-elements');

      canvasElement.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var Module = {
        print(...args) {
          console.log(...args);
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) / parseInt(m[4]) * 100;
            preloadElement.hidden = false;
          } else {
            progressElement.value = null;
            preloadElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left
            ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : '');
        }
      };

      function amara2Ready() {
        canvasElement.style.display = 'block';
        document.getElementById('loading-container').style.display = 'none';
      };

      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
